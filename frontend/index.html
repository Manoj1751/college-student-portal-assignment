<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Admission Portal</title><link rel="stylesheet" href="styles.css"></head><body><main class="page"><section class="form-card"><p class="eyebrow">COLLEGE ADMISSION</p><h1>Student Registration</h1><p class="muted">Enter the student details below.</p><form id="registrationForm" novalidate><div class="field"><label for="name">Full name</label><input id="name" name="name" required maxlength="100"><small class="error" id="nameError"></small></div><div class="field"><label for="roll">Roll number</label><input id="roll" name="roll" required maxlength="30"><small class="error" id="rollError"></small></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required><small class="error" id="emailError"></small></div><div class="field"><label for="course">Course</label><select id="course" name="course" required><option value="">Choose a course</option><option>B.E. Computer Science</option><option>B.Tech Information Technology</option><option>B.E. Electronics</option><option>B.E. Mechanical</option></select><small class="error" id="courseError"></small></div><div class="field"><label for="password">Create password</label><input id="password" name="password" type="password" required minlength="8"><small class="hint">At least 8 characters, uppercase, lowercase, and a number.</small><small class="error" id="passwordError"></small></div><div class="field"><label for="document">Admission document (PDF/JPG/PNG, max 2 MB)</label><input id="document" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png"><small class="error" id="documentError"></small></div><button type="submit">Validate registration</button><p id="formMessage" role="status" aria-live="polite"></p></form></section></main><script src="app.js"></script></body></html>
